name: Release

# Builds the extension and publishes a GitHub Release with both store packages
# whenever a version tag is pushed. Can also be run manually for an existing tag.
#
# IMPORTANT: bump the patch version before tagging (see AGENTS.md). This
# workflow fails if the tag does not match package.json's version.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.8.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Verify tag matches package.json
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PKG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG. Bump the version before tagging (see AGENTS.md)."
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Build packages
        run: npm run build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ciphertext ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            chrome/dist/ciphertext-chrome.zip
            mozilla/dist/ciphertext-firefox.xpi
